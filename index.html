<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>自由入力 数字入り目隠しツール</title>


<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #111;

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}


/* =========================
   操作バー
========================= */

.toolbar {

  position: sticky;

  top: 0;

  z-index: 20;

  background: #222;

  padding: 8px;

  display: flex;

  gap: 8px;

  align-items: center;

  justify-content: center;

  flex-wrap: wrap;
}


/* =========================
   ボタン
========================= */

button,
.fileBtn {

  border: none;

  border-radius: 9px;

  padding: 9px 12px;

  background: white;

  color: #111;

  font-weight: bold;

  font-size: 14px;

  cursor: pointer;
}


.fileBtn input {

  display: none;

}


/* =========================
   数字入力
========================= */

.number-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#numberInput {

  width: 75px;

  padding: 8px;

  border: none;

  border-radius: 7px;

  font-size: 16px;

  text-align: center;
}


/* =========================
   サイズ
========================= */

.control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


.control input[type="range"] {

  width: 90px;
}


.sizeValue {

  min-width: 45px;

  text-align: center;

  font-size: 12px;
}


/* =========================
   色
========================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#maskColor {

  border: none;

  border-radius: 7px;

  padding: 6px;

  font-weight: bold;
}


/* =========================
   画像エリア
========================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  touch-action: none;

  user-select: none;
}


#base {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;
}


/* =========================
   目隠し
========================= */

.mask {

  position: absolute;

  background: #b7e4c7;

  border: 3px solid white;

  border-radius: 8px;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  color: #111;

  font-weight: 900;

  line-height: 1;

  pointer-events: auto;

  box-shadow:
    0 2px 7px rgba(0,0,0,0.5);
}


.mask span {

  pointer-events: none;

}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  button,
  .fileBtn {

    padding: 8px 10px;

    font-size: 13px;

  }

  .control,
  .color-control,
  .number-control {

    font-size: 12px;

  }

  #numberInput {

    width: 65px;

  }

}

</style>

</head>


<body>


<!-- =========================
     操作バー
========================= -->

<div class="toolbar">


  <!-- 画像変更 -->

  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>



  <!-- 数字入力 -->

  <div class="number-control">

    🔢 番号

    <input
      id="numberInput"
      type="text"
      inputmode="numeric"
      placeholder="例：7"
    >

  </div>



  <!-- 横幅 -->

  <div class="control">

    ↔️ 横幅

    <input
      id="maskWidth"
      type="range"
      min="30"
      max="250"
      value="80"
    >

    <span
      id="widthValue"
      class="sizeValue"
    >
      80px
    </span>

  </div>



  <!-- 縦幅 -->

  <div class="control">

    ↕️ 縦幅

    <input
      id="maskHeight"
      type="range"
      min="30"
      max="250"
      value="80"
    >

    <span
      id="heightValue"
      class="sizeValue"
    >
      80px
    </span>

  </div>



  <!-- 色 -->

  <div class="color-control">

    🎨 色

    <select id="maskColor">

      <option value="#b7e4c7">
        🟢 薄いグリーン
      </option>

      <option value="#bde0fe">
        🔵 薄いブルー
      </option>

      <option value="#fff3b0">
        🟡 薄いイエロー
      </option>

      <option value="#ffd6a5">
        🟠 薄いオレンジ
      </option>

      <option value="#ffc8dd">
        🩷 薄いピンク
      </option>

      <option value="#d8c4f1">
        🟣 薄いパープル
      </option>

      <option value="#ffffff">
        ⚪ 白
      </option>

      <option value="#333333">
        ⚫ 黒
      </option>

    </select>

  </div>



  <!-- 1つ戻す -->

  <button id="undo">

    ↩ 1つ戻す

  </button>



  <!-- 全部消す -->

  <button id="clear">

    🗑️ 全部消す

  </button>


</div>



<!-- =========================
     画像
========================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="画像"
  >

</div>



<script>


/* =========================
   要素
========================= */

const board =
  document.getElementById("board");


const base =
  document.getElementById("base");


const imageFile =
  document.getElementById("imageFile");


const numberInput =
  document.getElementById("numberInput");


const maskWidth =
  document.getElementById("maskWidth");


const maskHeight =
  document.getElementById("maskHeight");


const widthValue =
  document.getElementById("widthValue");


const heightValue =
  document.getElementById("heightValue");


const maskColor =
  document.getElementById("maskColor");


const undo =
  document.getElementById("undo");


const clear =
  document.getElementById("clear");


/* =========================
   目隠し一覧
========================= */

let masks = [];


/* =========================
   数字サイズ
========================= */

function getFontSize(
  width,
  height
) {

  const smaller =
    Math.min(
      width,
      height
    );

  return Math.max(
    16,
    smaller * 0.42
  );

}


/* =========================
   サイズ変更
========================= */

function updateMaskSize() {

  const width =
    Number(maskWidth.value);

  const height =
    Number(maskHeight.value);


  widthValue.textContent =
    width + "px";


  heightValue.textContent =
    height + "px";


  /* すでに置いた目隠しも変更 */

  masks.forEach(
    function(item) {

      item.el.style.width =
        width + "px";

      item.el.style.height =
        height + "px";

      item.el.style.fontSize =
        getFontSize(
          width,
          height
        ) + "px";

    }
  );

}


maskWidth.addEventListener(
  "input",
  updateMaskSize
);


maskHeight.addEventListener(
  "input",
  updateMaskSize
);


/* =========================
   色変更
========================= */

maskColor.addEventListener(
  "change",
  function() {

    const color =
      maskColor.value;


    masks.forEach(
      function(item) {

        item.el.style.background =
          color;

      }
    );

  }
);


/* =========================
   目隠し追加
========================= */

function addMask(
  clientX,
  clientY
) {

  const rect =
    board.getBoundingClientRect();


  const x =
    clientX - rect.left;


  const y =
    clientY - rect.top;


  const width =
    Number(maskWidth.value);


  const height =
    Number(maskHeight.value);


  const color =
    maskColor.value;


  /* =========================
     目隠し本体
  ========================= */

  const el =
    document.createElement("div");


  el.className =
    "mask";


  el.style.left =
    x + "px";


  el.style.top =
    y + "px";


  el.style.width =
    width + "px";


  el.style.height =
    height + "px";


  el.style.background =
    color;


  el.style.fontSize =
    getFontSize(
      width,
      height
    ) + "px";


  /* =========================
     入力した数字
  ========================= */

  const span =
    document.createElement("span");


  span.textContent =
    numberInput.value;


  el.appendChild(span);


  /* 画像に配置 */

  board.appendChild(el);


  /* 管理 */

  const item = {

    el: el,

    x: x,

    y: y

  };


  masks.push(item);


  /* =========================
     目隠しをタップ
     → その目隠しだけ消す
  ========================= */

  el.addEventListener(
    "pointerup",
    function(e) {

      e.stopPropagation();


      const index =
        masks.indexOf(item);


      if (index !== -1) {

        masks.splice(
          index,
          1
        );

      }


      el.remove();

    }
  );

}


/* =========================
   画像をタップ
========================= */

board.addEventListener(
  "pointerup",
  function(e) {

    if (
      e.target === base ||
      e.target === board
    ) {

      addMask(
        e.clientX,
        e.clientY
      );

    }

  }
);


/* =========================
   1つ戻す
========================= */

undo.addEventListener(
  "click",
  function() {

    const item =
      masks.pop();


    if (item) {

      item.el.remove();

    }

  }
);


/* =========================
   全部消す
========================= */

clear.addEventListener(
  "click",
  function() {

    masks.forEach(
      function(item) {

        item.el.remove();

      }
    );


    masks = [];

  }
);


/* =========================
   画像変更
========================= */

imageFile.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];


    if (!file) {
      return;
    }


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /* 画像変更時は
       目隠しを全部消す */

    masks.forEach(
      function(item) {

        item.el.remove();

      }
    );


    masks = [];

  }
);


/* =========================
   Enterキーでも入力確定
========================= */

numberInput.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Enter") {

      numberInput.blur();

    }

  }
);

</script>

</body>
</html>
